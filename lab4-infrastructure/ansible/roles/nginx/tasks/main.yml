---
- name: Install Nginx
  apt:
    name: nginx
    state: present
    update_cache: yes

- name: Remove default Nginx site from sites-enabled
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: restart nginx

- name: Remove default Nginx site from sites-available
  file:
    path: /etc/nginx/sites-available/default
    state: absent
  notify: restart nginx

- name: Copy MyWebapp Nginx configuration
  template:
    src: nginx.conf.j2
    dest: /etc/nginx/sites-available/mywebapp.conf
  notify: restart nginx

- name: Enable MyWebapp configuration via symlink
  file:
    src: /etc/nginx/sites-available/mywebapp.conf
    dest: /etc/nginx/sites-enabled/mywebapp.conf
    state: link
  notify: restart nginx

- name: Test Nginx configuration syntax
  command: nginx -t
  changed_when: false

- name: Ensure Nginx is started and enabled
  systemd:
    name: nginx
    state: started
    enabled: yes
