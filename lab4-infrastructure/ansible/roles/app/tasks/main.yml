---
- name: Create system user 'app'
  user:
    name: app
    system: yes
    shell: /usr/sbin/nologin

- name: Create user 'operator'
  user:
    name: operator
    shell: /bin/bash
    password: '$6$rounds=656000$.uEbyf87G00H4oI/$B1C333wH4S6A62v1nU6qD47bM9i7ZbeXmcl0VpGis94A9vRj89UfA.D0Z6L38V12K6C1L0VpGis94A9vRj89Uf.'

- name: Configure strict sudo rules for 'operator'
  copy:
    content: |
      operator ALL=(ALL) NOPASSWD: /usr/bin/systemctl start mywebapp.service, /usr/bin/systemctl stop mywebapp.service, /usr/bin/systemctl restart mywebapp.service, /usr/bin/systemctl status mywebapp.service, /usr/bin/systemctl reload nginx
    dest: /etc/sudoers.d/operator
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'

- name: Ensure /home/student directory exists
  file:
    path: /home/student
    state: directory
    mode: '0755'

- name: Create gradebook file
  copy:
    content: '24'
    dest: /home/student/gradebook
    mode: '0644'

- name: Add NodeSource official apt key
  apt_key:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    state: present

- name: Add NodeSource apt repository for Node.js v24
  apt_repository:
    repo: deb https://deb.nodesource.com/node_24.x nodistro main
    state: present
    update_cache: yes

- name: Install Node.js v24
  apt:
    name: nodejs
    state: present

- name: Create webapp directory
  file:
    path: /var/www/webapp
    state: directory
    owner: app
    group: app
    mode: '0755'

- name: Copy package.json
  copy:
    src: '../../../../package.json'
    dest: /var/www/webapp/package.json
    owner: app
    group: app
    mode: '0644'

- name: Copy package-lock.json
  copy:
    src: '../../../../package-lock.json'
    dest: /var/www/webapp/package-lock.json
    owner: app
    group: app
    mode: '0644'

- name: Copy tsconfig.json
  copy:
    src: '../../../../tsconfig.json'
    dest: /var/www/webapp/tsconfig.json
    owner: app
    group: app
    mode: '0644'

- name: Copy tsconfig.build.json
  copy:
    src: '../../../../tsconfig.build.json'
    dest: /var/www/webapp/tsconfig.build.json
    owner: app
    group: app
    mode: '0644'
  ignore_errors: yes

- name: Copy nest-cli.json
  copy:
    src: '../../../../nest-cli.json'
    dest: /var/www/webapp/nest-cli.json
    owner: app
    group: app
    mode: '0644'
  ignore_errors: yes

- name: Copy src directory
  synchronize:
    src: '../../../../src/'
    dest: /var/www/webapp/src/
    archive: no
    recursive: yes
  notify: restart mywebapp

- name: Install npm packages (npm ci)
  npm:
    path: /var/www/webapp
    state: present
    ci: true

- name: Build production application
  command: npm run build
  args:
    chdir: /var/www/webapp
    creates: /var/www/webapp/dist/main.js

- name: Prune development dependencies
  command: npm prune --production
  args:
    chdir: /var/www/webapp

- name: Set permissions for application folder
  file:
    path: /var/www/webapp
    owner: app
    group: app
    recurse: yes

- name: Generate mywebapp.socket from template
  template:
    src: mywebapp.socket.j2
    dest: /etc/systemd/system/mywebapp.socket
  notify: restart mywebapp

- name: Generate mywebapp.service from template
  template:
    src: mywebapp.service.j2
    dest: /etc/systemd/system/mywebapp.service
  notify: restart mywebapp

- name: Enable and start mywebapp socket
  systemd:
    name: mywebapp.socket
    state: started
    enabled: yes
    daemon_reload: yes
